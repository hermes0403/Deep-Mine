<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>深層礦域</title>
<style>
:root{color-scheme:dark;--bg:#0d0b12;--panel:#1b1724;--ac:#f5b942;--tx:#f1ece4;--mut:#9a92a8;--err:#ff7b7b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a2236,var(--bg));padding:20px;z-index:5;touch-action:auto}
.card{width:100%;max-width:360px;background:var(--panel);border-radius:18px;padding:22px;box-shadow:0 10px 40px #000a}
h1{margin:0 0 4px;font-size:30px;color:var(--ac);text-align:center;letter-spacing:4px}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:16px}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #3a3350;background:#120f1a;color:var(--tx);font-size:16px;touch-action:auto}
button.b{width:100%;padding:13px;margin:6px 0;border:0;border-radius:12px;background:var(--ac);color:#1a1200;font-weight:700;font-size:16px}
button.b.s{background:#2d2640;color:var(--tx)}
.msg{min-height:20px;font-size:13px;margin:6px 0;color:var(--err)}.msg.ok{color:#7be0a0}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin-top:10px}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:none;justify-content:space-between;padding:10px 12px;z-index:3;pointer-events:none;font-size:14px}
#hud>div{background:#000a;border-radius:10px;padding:6px 10px}
#out{pointer-events:auto}
#joy{position:fixed;left:24px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff40;display:none;z-index:3}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#ffffff66}
#tip{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;color:var(--mut);z-index:3;pointer-events:none;display:none}
.ui{position:fixed;z-index:4;border:0;color:#fff;font-weight:700}
#dig{right:22px;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;background:#e0702acc;font-size:18px;display:none}
#dig:active{transform:scale(.92)}
#bag,#adm{right:12px;width:52px;height:52px;border-radius:14px;background:#000a;font-size:22px;display:none}
#bag{top:64px}#adm{top:124px}
#tg{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:13px;z-index:3;pointer-events:none;color:var(--ac)}
#toast{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:20px;font-weight:700;z-index:6;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 2px 6px #000}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #3a3350;font-size:14px}
.row input{margin:0;padding:6px}
#shop{right:12px;top:184px;width:52px;height:52px;border-radius:14px;background:#000a;font-size:22px;display:none}
.sw{width:26px;height:26px;border-radius:6px;flex:none}
.row button{width:auto;margin:0;padding:6px 10px;font-size:13px}
#rail{position:fixed;right:12px;top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:4}
#rail .ui{position:static;width:48px;height:48px;border-radius:14px;background:#000a;font-size:20px}
#tg{top:calc(76px + env(safe-area-inset-top,0px))}
#hud>div{white-space:nowrap;font-size:13px;line-height:1.5}
.row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .two{flex:1;display:block}.row .two small{display:block;color:var(--mut);font-size:12px}
.note{white-space:nowrap}
.card{position:relative;max-height:88vh;overflow-y:auto}
.card,.card *{touch-action:pan-y}
.card>.b.s:last-child{position:sticky;bottom:0}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;border-radius:50%;background:#2d2640;color:#fff;font-size:18px;z-index:2;margin:0;padding:0}
#rail{max-height:calc(100vh - 220px);flex-wrap:wrap-reverse;align-content:flex-start}
@media (orientation:landscape){#joy{width:110px;height:110px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}#knob{left:25px;top:25px}#dig{bottom:calc(16px + env(safe-area-inset-bottom,0px));width:84px;height:84px}#rail{max-height:calc(100vh - 190px);right:calc(12px + env(safe-area-inset-right,0px))}#joy{left:calc(24px + env(safe-area-inset-left,0px))}.screen{align-items:flex-start;overflow-y:auto}.card{margin:auto}}
textarea{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #3a3350;background:#120f1a;color:var(--tx);font-size:13px;touch-action:auto}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><div>👤 <span id="pn">-</span>　💰 <span id="coin">0</span><br>⛏ <span id="pk">木製十字鎬</span>　🎒 <span id="cap">0/50</span></div><div>⬇ <span id="dp">0</span>m　<button id="out" class="b s ui" style="width:auto;margin:0;padding:4px 10px;font-size:13px">登出</button></div></div>
<div id="joy"><div id="knob"></div></div>
<div id="tip">搖桿移動・拖曳轉視角</div>

<div id="tg"></div><div id="toast"></div>
<button class="ui" id="dig">⛏ 挖掘</button><div id="rail"><button class="ui" id="bag">🎒</button><button class="ui" id="shop">🛒</button><button class="ui" id="zn">🧭</button><button class="ui" id="cx">📖</button><button class="ui" id="tr">🏆</button><button class="ui" id="adm">🛠</button></div>
<div class="screen" id="bagp" style="display:none"><div class="card"><h1 style="font-size:22px">背包</h1><div class="note" id="bagc"></div><div id="bagl"></div><div id="bagmsg" class="msg ok"></div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="shopp" style="display:none"><div class="card" style="max-width:420px;max-height:90vh;overflow:auto"><h1 style="font-size:22px">十字鎬商店</h1><div class="note" id="shopc"></div><div id="shopl"></div><div id="shopmsg" class="msg"></div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="cxp" style="display:none"><div class="card" style="max-width:420px;max-height:90vh;overflow:auto"><h1 style="font-size:22px">礦物圖鑑</h1><div class="note" id="cxc"></div><div id="cxl"></div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="trp" style="display:none"><div class="card" style="max-width:420px;max-height:90vh;overflow:auto"><h1 style="font-size:22px">資料與成就</h1><div id="trl"></div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="zonp" style="display:none"><div class="card" style="max-width:420px"><h1 style="font-size:22px">礦區</h1><div id="zonl"></div><div id="zonm" class="msg"></div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="pwp" style="display:none;z-index:8"><div class="card"><h1 style="font-size:22px">管理員驗證</h1><div class="note">請輸入密碼</div><input id="pwi" type="password" inputmode="numeric" placeholder="密碼"><div id="pwm" class="msg"></div><button class="b" id="pwok">確認</button><button class="b s" id="pwno">取消</button></div></div>
<div class="screen" id="rmp" style="display:none;z-index:8"><div class="card" style="text-align:center"><h1 style="font-size:22px">帳號建立成功</h1><div class="note" style="text-align:center">請牢記你的玩家名稱</div><div id="rmn" style="font-size:26px;font-weight:700;color:var(--ac);margin:12px 0;word-break:break-all"></div><div class="note" id="rmt" style="text-align:center"></div><div class="note" style="text-align:center">進度會自動永久保存</div><button class="b" id="rmok">我記住了，開始遊戲</button></div></div>
<div class="screen" id="expp" style="display:none;z-index:8"><div class="card"><h1 style="font-size:22px">匯出存檔碼</h1><div class="note">貼到 GitHub 版註冊頁的匯入欄</div><textarea id="expt" readonly rows="4"></textarea><div id="expm" class="msg ok"></div><button class="b" id="expc">複製</button><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="admp" style="display:none"><div class="card" style="max-width:420px"><h1 style="font-size:22px">管理員面板</h1><div class="note">玩家清單與金幣發放（僅管理員可見）</div><div id="admlist"></div><button class="b s" onclick="renderAdm()">重新整理</button><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="title"><div class="card">
<h1>深層礦域</h1><div class="sub">礦坑探索 試玩版</div>
<div id="st" class="note" style="margin:0 0 8px">連線中…</div>
<div id="menu" style="display:none"><button class="b" id="bLogin">登入帳號</button><button class="b s" id="bReg">註冊新帳號</button></div>
<div id="lg" style="display:none"><div class="note" style="color:var(--tx)">登入現有帳號</div><input id="ln" placeholder="玩家名稱" maxlength="12"><input id="lp" type="password" placeholder="密碼"><button class="b" id="bLoginGo">登入</button><button class="b s" id="bBack1">返回</button></div>
<div id="reg" style="display:none"><div class="note" style="color:var(--tx)">註冊新帳號</div><input id="rn" placeholder="玩家名稱（2–12 字）" maxlength="12"><input id="rp" type="password" placeholder="密碼（至少 4 碼）"><input id="rp2" type="password" placeholder="確認密碼"><textarea id="imp" rows="2" placeholder="匯入存檔碼（選填）"></textarea><button class="b" id="bRegGo">註冊並進入遊戲</button><button class="b s" id="bBack">返回</button></div>
<div id="msg" class="msg"></div>
<button class="b s" id="bOff" style="display:none">離線試玩（不存檔）</button>
<div class="note" id="n1"></div><div class="note">請牢記你的玩家名稱</div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let db=null,uid=null,profile=null,offline=false,running=false,saveT=0,isAdmin=false;
const OD=[{id:'stone',n:'普通石塊',hp:20,min:5,c:0x8a8a8a,sc:0,p:5},{id:'coal',n:'煤礦',hp:40,min:5,c:0x2a2a30,sc:0x666677,p:12},{id:'copper',n:'銅礦',hp:80,min:10,c:0x8a5a3a,sc:0xff9a4a,p:30},{id:'iron',n:'鐵礦',hp:120,min:10,c:0x8f8580,sc:0xe8e0d8,p:55},{id:'gold',n:'黃金礦',hp:200,min:22,c:0x8a7a2a,sc:0xffd34a,p:180},{id:'bcrystal',n:'藍水晶',hp:300,min:22,c:0x2a5a8a,sc:0x59b8ff,p:350},{id:'amethyst',n:'紫水晶',hp:600,min:45,c:0x5a2a8a,sc:0xb36bff,p:900},{id:'ruby',n:'紅寶石礦',hp:800,min:45,c:0x8a2a3a,sc:0xff4a6a,p:1800},{id:'lava',n:'熔岩礦',hp:1500,min:90,c:0x5a1a0a,sc:0xff7a1a,p:5000},{id:'meteor',n:'星隕礦',hp:2500,min:180,c:0x2a2a4a,sc:0x8a7aff,p:12000},{id:'fossil',n:'遠古化石礦',hp:5000,min:350,c:0x6a5a3a,sc:0xd8c9a0,p:30000},{id:'void',n:'虛空核心',hp:8000,min:700,c:0x2a0a3a,sc:0xc040ff,p:80000}];
async function applyGrant(){ try{ const g=await db.doc('grants/'+uid).get(); if(g.exists){const d=g.data(); if(d.nonce&&d.nonce!==profile.lastGrant&&Number.isFinite(d.amount)){profile.coins=Math.max(0,(profile.coins||0)+d.amount);profile.lastGrant=d.nonce;await pdoc().set(profile);}} }catch(e){} }
$('bag').onclick=()=>{ const l=$('bagl'); l.innerHTML=''; OD.forEach(o=>{const n=(profile.inv||{})[o.id]||0; const r=document.createElement('div'); r.className='row'; r.textContent=o.n+'　×'+n+'　（單件 '+o.p+' 金）'; l.append(r);}); $('bagp').style.display='flex'; };
$('adm').onclick=()=>{ $('admp').style.display='flex'; renderAdm(); };
const msg=(t,ok)=>{$('msg').textContent=t||'';$('msg').className='msg'+(ok?' ok':'')};
const nameKey=n=>[...n.toLowerCase()].map(c=>c.codePointAt(0).toString(16)).join('-');
const pdoc=()=>db.doc('data/users/'+uid+'/profile');

async function boot(){
  try{ if(window.claude){ db=await claude.use('db'); const u=await claude.use('user'); if(u){ uid=await u.id(); isAdmin=await u.isOwner(); } } }catch(e){}
  $('bOff').style.display='block';
  if(!db||!uid){ $('st').textContent='無法連線存檔，可離線試玩';return; }
  try{
    const s=await pdoc().get();
    if(s.exists){ profile=JSON.parse(JSON.stringify(s.data())); $('st').textContent='找到存檔：'+profile.name; $('menu').style.display='block'; $('bLogin').textContent='登入（'+profile.name+'）'; $('bReg').style.display='none'; }
    else{ $('st').textContent='尚無資料，請先創建帳號'; $('menu').style.display='block'; $('bLogin').style.display='none'; }
  }catch(e){ $('st').textContent='讀取失敗，請重新整理'; }
}
$('bReg').onclick=()=>{$('menu').style.display='none';$('reg').style.display='block';msg('')};
$('bBack').onclick=()=>{$('reg').style.display='none';$('menu').style.display='block';msg('')};
$('bLogin').onclick=async()=>{ if(profile){ if(profile.name.toLowerCase()==='hermes'&&!(await askPw())) return msg('密碼錯誤'); await applyGrant(); startGame(); } };
$('bOff').onclick=()=>{ offline=true; profile={name:'訪客',coins:0,x:0,z:0,depth:0}; startGame(); };
$('bRegGo').onclick=async()=>{
  const n=$('rn').value.trim();
  if(!/^[\u4e00-\u9fa5A-Za-z0-9_-]{2,12}$/.test(n)) return msg('名稱需 2–12 字（中英數）');
  try{
    if(n.toLowerCase()==='hermes'&&!(await askPw())) return msg('密碼錯誤，無法使用此名稱');
    const nd=db.doc('names/'+nameKey(n)); const ex=await nd.get();
    if(ex.exists) return msg('此玩家名稱已被使用');
    await nd.set({owner:uid});
    const again=await nd.get(); if(again.data().owner!==uid) return msg('此玩家名稱已被使用');
    profile={name:n,coins:0,pickaxe:'wood',owned:['wood'],x:0,z:0,depth:0,maxDepth:0,inv:{},created:Date.now()};
    await pdoc().set(profile); await new Promise(r=>{ $('rmn').textContent=profile.name; $('rmp').style.display='flex'; $('rmok').onclick=()=>{ $('rmp').style.display='none'; r(); }; }); startGame();
  }catch(e){ msg('建立失敗，請稍後再試'); }
};
$('out').onclick=async()=>{ await save(true); location.reload(); };
let saving=false,dirty=false;
async function save(force){
  if(offline||!profile) return;
  if(localMode){ LS.set('dm:'+lkey,{salt:lsalt,hash:lhash,profile}); return; }
  if(!db) return;
  if(saving){ dirty=true; return; }
  saving=true;
  try{ do{ dirty=false; const snap=JSON.parse(JSON.stringify(profile)); await pdoc().set(snap); await db.doc('players/'+uid).set({name:snap.name,coins:snap.coins||0,maxDepth:snap.maxDepth||0,t:Date.now()}); }while(dirty); }
  catch(e){ if(window.gt) gt('存檔失敗，5 秒後重試'); setTimeout(()=>save(),5000); if(force) alert('存檔失敗，請檢查網路'); }
  saving=false;
}

/* ---------- 3D ---------- */
function startGame(){
  $('title').style.display='none';
  ['hud','joy','tip'].forEach(i=>$(i).style.display=(i==='hud'?'flex':'block'));
  $('pn').textContent=profile.name+(offline?'（離線）':'');
  $('coin').textContent=profile.coins||0; profile.inv=profile.inv||{}; $('dig').style.display=$('bag').style.display=$('shop').style.display=$('zn').style.display=$('cx').style.display=$('tr').style.display='block'; profile.found=profile.found||{}; Object.keys(profile.inv).forEach(k=>{if(profile.inv[k]>0)profile.found[k]=1}); profile.chests=profile.chests||{}; profile.relics=profile.relics||{}; profile.ach=profile.ach||{}; profile.zones=profile.zones||{}; refresh();
  if(db&&uid&&!localMode&&!offline){ try{ db.doc('grants/'+uid).onSnapshot(sn=>{ if(!sn.exists) return; const d=sn.data(); if(d.nonce&&d.nonce!==profile.lastGrant&&Number.isFinite(d.amount)){ profile.lastGrant=d.nonce; profile.coins=Math.max(0,(profile.coins||0)+d.amount); refresh(); save(); gt((d.amount>0?'管理員發放 +':'管理員扣除 ')+Math.abs(d.amount)+' 金'); } }); }catch(e){} } $('adm').style.display=(isAdmin&&profile.name==='Hermes'&&!offline)?'block':'none';
  if(running) return; running=true;
  if(!window.THREE){ alert('3D 引擎載入失敗'); return; }
  const cv=$('cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:false});
  R.setPixelRatio(Math.min(devicePixelRatio,1.5)); R.shadowMap.enabled=true;
  const S=new THREE.Scene(); S.background=new THREE.Color(0x0b0910); S.fog=new THREE.Fog(0x0b0910,8,38);
  const C=new THREE.PerspectiveCamera(60,1,.1,80);
  S.add(new THREE.HemisphereLight(0x8a7fb0,0x2a2018,.55));
  const torch=new THREE.PointLight(0xffc070,1.4,22,1.6); torch.castShadow=false; torch.shadow.mapSize.set(512,512); S.add(torch);
  const rs=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})();
  const M=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r,flatShading:true});
  const SZ=56; const obst=[];
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(SZ*2+4,SZ*2+4,1,1),M(0x3b3340)); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; S.add(ground);
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(SZ*2+4,SZ*2+4),M(0x1a1620)); ceil.rotation.x=Math.PI/2; ceil.position.y=7; S.add(ceil);
  // boundary walls
  const wm=M(0x4a4152,1);
  for(let i=0;i<4;i++){ const w=new THREE.Mesh(new THREE.BoxGeometry(SZ*2+4,7,2),wm); w.position.y=3.5;
    const a=i*Math.PI/2; w.position.x=Math.sin(a)*(SZ+1); w.position.z=Math.cos(a)*(SZ+1); w.rotation.y=a; w.receiveShadow=true; S.add(w); }
  // rock pillars / boulders (collision circles), keep spawn clear
  const rg=new THREE.DodecahedronGeometry(1,0);
  for(let i=0;i<160;i++){
    const x=(rs()*2-1)*(SZ-3),z=(rs()*2-1)*(SZ-3); if(Math.hypot(x,z)<5) continue;
    const r=.8+rs()*1.8,h=r*(1+rs()*2.2);
    const m=new THREE.Mesh(rg,M(rs()<.5?0x5a5163:0x4d4457)); m.scale.set(r,h,r); m.position.set(x,h*.8,z); m.rotation.y=rs()*6; m.castShadow=m.receiveShadow=true; S.add(m);
    obst.push({x,z,r:r*.95});
  }
  // stalactites for cave feel
  for(let i=0;i<90;i++){ const m=new THREE.Mesh(new THREE.ConeGeometry(.4+rs()*.5,2+rs()*2,5),wm); m.rotation.x=Math.PI; m.position.set((rs()*2-1)*SZ,6.2,(rs()*2-1)*SZ); S.add(m); }
  // glowing crystals as decoration only (not minable)
  for(let i=0;i<12;i++){ const m=new THREE.Mesh(new THREE.OctahedronGeometry(.35),new THREE.MeshBasicMaterial({color:i%2?0x59b8ff:0xb36bff}));
    m.position.set((rs()*2-1)*(SZ-3),.4,(rs()*2-1)*(SZ-3)); S.add(m); if(i<3){ const l=new THREE.PointLight(i%2?0x59b8ff:0xb36bff,.5,6); l.position.copy(m.position); S.add(l); } }
  // player
  const P=new THREE.Group(),sk=M(0xf2c9a0),sh=M(0x3b6fd6),pt=M(0x3a3a4a);
  const mk=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;P.add(o);return o};
  mk(new THREE.BoxGeometry(.7,.8,.4),sh,0,1.2,0); mk(new THREE.BoxGeometry(.5,.5,.5),sk,0,1.85,0);

$('tr').onclick=()=>{ const p=profile,l=$('trl'); l.innerHTML=''; const row=(a,b)=>{ const r=document.createElement('div'); r.className='row'; const x=document.createElement('span'); x.textContent=a; const y=document.createElement('span'); y.textContent=b; r.append(x,y); l.append(r); };

const ZN=[['crystal','水晶洞窟',150,'steel','鐵鋼鎬',1000],['lava','熔岩深層',300,'crystal','水晶鎬',10000],['ruins','遠古遺跡',450,'obsidian','黑曜鎬',100000]];

  const row=(n,sub,label,fn)=>{ const r=document.createElement('div'); r.className='row'; const b=document.createElement('button'); b.className='b'; b.textContent=label; b.onclick=fn; r.append(two(n,sub),b); l.append(r); };

addEventListener('pagehide',()=>save()); const CAPS=[50,100,200,400,800],SPDS=[5,6,7,8];

  b.onclick=()=>{ const m=$('shopmsg'); if((profile.coins||0)<price){ m.className='msg'; m.textContent='金幣不足，還差 '+(price-(profile.coins||0)).toLocaleString()+' 金'; return; } profile.coins-=price; profile[d[0]]=lv+1; refresh(); save(); m.className='msg ok'; m.textContent=d[1]+'已升級'; renderShop(); };
  r.append(two(d[4]+' '+d[1]+' Lv'+(lv+1),(done?'':d[2][lv]+' → ')+d[2][done?lv:lv+1]),b); l.append(r); }); }
addEventListener('error',e=>gt('錯誤：'+e.message));
let localMode=false,lkey=null,lsalt=null,lhash=null,cloudProfile=null;
const LS={get:k=>{ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }};
async function hashPw(pw,salt){ const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']); const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const mkProfile=n=>({name:n,coins:0,pickaxe:'wood',owned:['wood'],x:0,z:0,depth:0,maxDepth:0,inv:{},created:Date.now()});

$('bLogin').onclick=async()=>{ msg(''); if(localMode) return showForm('lg'); if(!cloudProfile) return msg('尚無帳號，請先註冊');

$('bLoginGo').onclick=async()=>{ const n=$('ln').value.trim(),rec=n&&LS.get('dm:'+nameKey(n)); if(!rec) return msg('找不到此帳號，請先註冊');
  if(await hashPw($('lp').value,rec.salt)!==rec.hash) return msg('密碼錯誤');
  if(n.toLowerCase()==='hermes'&&!(await askPw())) return msg('管理員密碼錯誤');
  profile=rec.profile; lkey=nameKey(n); lsalt=rec.salt; lhash=rec.hash; startGame(); };
$('bRegGo').onclick=async()=>{ const n=$('rn').value.trim();
  if(!/^[\u4e00-\u9fa5A-Za-z0-9_-]{2,12}$/.test(n)) return msg('名稱需 2–12 字（中英數）');
  if(localMode){ const pw=$('rp').value; if(pw.length<4) return msg('密碼至少 4 碼'); if(pw!==$('rp2').value) return msg('兩次密碼不一致'); if(LS.get('dm:'+nameKey(n))) return msg('此玩家名稱已被使用'); }
  if(n.toLowerCase()==='hermes'&&!(await askPw())) return msg('管理員密碼錯誤');
  try{
    if(localMode){ const salt=Math.random().toString(36).slice(2)+Date.now(),hash=await hashPw($('rp').value,salt),np=impProfile(n); if(!LS.set('dm:'+nameKey(n),{salt,hash,profile:np})) return msg('無法寫入本機儲存空間'); profile=np; lkey=nameKey(n); lsalt=salt; lhash=hash; }
    else{ if(cloudProfile) return msg('你已有帳號，請直接登入'); const nd=db.doc('names/'+nameKey(n)); if((await nd.get()).exists) return msg('此玩家名稱已被使用'); await nd.set({owner:uid}); if((await nd.get()).data().owner!==uid) return msg('此玩家名稱已被使用');
      profile=mkProfile(n); await pdoc().set(profile); cloudProfile=profile; }
  }catch(e){ return msg(e&&e.message==='bad'?'存檔碼無效':'建立失敗，請稍後再試'); }

async function boot2(){
  try{ if(window.claude){ db=await claude.use('db'); const u=await claude.use('user'); if(u){ uid=await u.id(); isAdmin=await u.isOwner(); } } }catch(e){}

const ago=ms=>ms<3.6e6?Math.max(1,Math.round(ms/6e4))+' 分鐘前':ms<8.64e7?Math.round(ms/3.6e6)+' 小時前':Math.round(ms/8.64e7)+' 天前';

function impProfile(n){ const v=$('imp').value.trim(); if(!v) return mkProfile(n); let o; try{ o=JSON.parse(decodeURIComponent(escape(atob(v)))); }catch(e){ throw new Error('bad'); }
