<script>
const $=id=>document.getElementById(id);
const SB_URL='https://fzdguxbwpavbmckorzyc.supabase.co',SB_KEY='sb_publishable_H795alzKum-YluKND1n3Eg_HY5y_qhA';
let sbMode=false,sbS=null,sbSaving=false,sbDirty=false;
let db=null,uid=null,profile=null,offline=false,running=false,saveT=0,isAdmin=false;
const OD=[{id:'stone',n:'普通石塊',hp:20,min:5,c:0x8a8a8a,sc:0,p:5},{id:'coal',n:'煤礦',hp:40,min:5,c:0x2a2a30,sc:0x666677,p:12},{id:'copper',n:'銅礦',hp:80,min:10,c:0x8a5a3a,sc:0xff9a4a,p:30},{id:'iron',n:'鐵礦',hp:120,min:10,c:0x8f8580,sc:0xe8e0d8,p:55},{id:'gold',n:'黃金礦',hp:200,min:22,c:0x8a7a2a,sc:0xffd34a,p:180},{id:'bcrystal',n:'藍水晶',hp:300,min:22,c:0x2a5a8a,sc:0x59b8ff,p:350},{id:'amethyst',n:'紫水晶',hp:600,min:45,c:0x5a2a8a,sc:0xb36bff,p:900},{id:'ruby',n:'紅寶石礦',hp:800,min:45,c:0x8a2a3a,sc:0xff4a6a,p:1800},{id:'lava',n:'熔岩礦',hp:1500,min:90,c:0x5a1a0a,sc:0xff7a1a,p:5000},{id:'meteor',n:'星隕礦',hp:2500,min:180,c:0x2a2a4a,sc:0x8a7aff,p:12000},{id:'fossil',n:'遠古化石礦',hp:5000,min:350,c:0x6a5a3a,sc:0xd8c9a0,p:30000},{id:'void',n:'虛空核心',hp:8000,min:700,c:0x2a0a3a,sc:0xc040ff,p:80000},{id:'abyss',n:'深淵晶',hp:15000,min:1000,c:0x201040,sc:0x7a5cff,p:150000},{id:'prism',n:'稜光晶',hp:30000,min:1500,c:0x103040,sc:0x40ffe0,p:400000},{id:'omega',n:'終末晶核',hp:60000,min:2000,c:0x0a0a1a,sc:0xff3a6e,p:1000000}];
async function applyGrant(){ try{ const g=await db.doc('grants/'+uid).get(); if(g.exists){const d=g.data(); if(d.nonce&&d.nonce!==profile.lastGrant&&Number.isFinite(d.amount)){profile.coins=Math.max(0,(profile.coins||0)+d.amount);profile.lastGrant=d.nonce;await pdoc().set(profile);}} }catch(e){} }
$('bag').onclick=()=>{ const l=$('bagl'); l.innerHTML=''; OD.forEach(o=>{const n=(profile.inv||{})[o.id]||0; const r=document.createElement('div'); r.className='row'; r.textContent=o.n+'　×'+n+'　（單件 '+o.p+' 金）'; l.append(r);}); $('bagp').style.display='flex'; };

const pdoc=()=>db.doc('data/users/'+uid+'/profile');

async function boot(){
  try{ if(window.claude){ db=await claude.use('db'); const u=await claude.use('user'); if(u){ uid=await u.id(); isAdmin=await u.isOwner(); } } }catch(e){}
  $('bOff').style.display='block';
  if(!db||!uid){ $('st').textContent='無法連線存檔，可離線試玩';return; }
  try{
    const s=await pdoc().get();
    if(s.exists){ profile=JSON.parse(JSON.stringify(s.data())); $('st').textContent='找到存檔：'+profile.name; $('menu').style.display='block'; $('bLogin').textContent='登入（'+profile.name+'）'; $('bReg').style.display='none'; }
    else{ $('st').textContent='尚無資料，請先創建帳號'; $('menu').style.display='block'; $('bLogin').style.display='none'; }
  }catch(e){ $('st').textContent='讀取失敗，請重新整理'; }
}
$('bReg').onclick=()=>{$('menu').style.display='none';$('reg').style.display='block';msg('')};
$('bBack').onclick=()=>{$('reg').style.display='none';$('menu').style.display='block';msg('')};
$('bLogin').onclick=async()=>{ if(profile){ if(profile.name.toLowerCase()==='hermes'&&!(await askPw())) return msg('密碼錯誤'); await applyGrant(); startGame(); } };
$('bOff').onclick=()=>{ offline=true; profile={name:'訪客',coins:0,x:0,z:0,depth:0}; startGame(); };
$('bRegGo').onclick=async()=>{
  const n=$('rn').value.trim();
  if(!/^[\u4e00-\u9fa5A-Za-z0-9_-]{2,12}$/.test(n)) return msg('名稱需 2–12 字（中英數）');
  try{
    if(n.toLowerCase()==='hermes'&&!(await askPw())) return msg('密碼錯誤，無法使用此名稱');
    const nd=db.doc('names/'+nameKey(n)); const ex=await nd.get();
    if(ex.exists) return msg('此玩家名稱已被使用');
    await nd.set({owner:uid});
    const again=await nd.get(); if(again.data().owner!==uid) return msg('此玩家名稱已被使用');
    profile={name:n,coins:0,pickaxe:'wood',owned:['wood'],x:0,z:0,depth:0,maxDepth:0,inv:{},created:Date.now()};
    await pdoc().set(profile); await new Promise(r=>{ $('rmn').textContent=profile.name; $('rmp').style.display='flex'; $('rmok').onclick=()=>{ $('rmp').style.display='none'; r(); }; }); startGame();
  }catch(e){ msg('建立失敗，請稍後再試'); }
};
$('out').onclick=async()=>{ if(sbMode){ await sbSave(); LS.set('dm:session',null); } else await save(true); location.reload(); };
let saving=false,dirty=false;
async function save(force){
  if(sbMode) return sbSave();
  if(offline||!profile) return;
  if(localMode){ LS.set('dm:'+lkey,{salt:lsalt,hash:lhash,profile}); return; }
  if(!db) return;
  if(saving){ dirty=true; return; }
  saving=true;
  try{ do{ dirty=false; const snap=JSON.parse(JSON.stringify(profile)); await pdoc().set(snap); await db.doc('players/'+uid).set({name:snap.name,coins:snap.coins||0,maxDepth:snap.maxDepth||0,t:Date.now()}); }while(dirty); }
  catch(e){ if(window.gt) gt('存檔失敗，5 秒後重試'); setTimeout(()=>save(),5000); if(force) alert('存檔失敗，請檢查網路'); }
  saving=false;
}

/* ---------- 3D ---------- */
function startGame(){
  $('title').style.display='none';
  ['hud','joy','tip'].forEach(i=>$(i).style.display=(i==='hud'?'flex':'block'));
  $('pn').textContent=profile.name+(offline?'（離線）':'');
  $('coin').textContent=profile.coins||0; profile.inv=profile.inv||{}; $('dig').style.display=$('bag').style.display=$('shop').style.display=$('zn').style.display=$('mp').style.display=$('cx').style.display=$('tr').style.display='block'; profile.found=profile.found||{}; Object.keys(profile.inv).forEach(k=>{if(profile.inv[k]>0)profile.found[k]=1}); profile.chests=profile.chests||{}; profile.relics=profile.relics||{}; profile.ach=profile.ach||{}; profile.zones=profile.zones||{}; profile.dug=profile.dug||{}; profile.exp=profile.exp||{}; profile.poi=profile.poi||[]; profile.rooms=profile.rooms||{}; profile.puzzles=profile.puzzles||{}; profile.biomes=profile.biomes||{}; if(!profile.seed) profile.seed=(Math.random()*4294967296)>>>0; profile.sites=profile.sites||{}; if(profile.xp==null) profile.xp=Math.min(400,Math.floor((profile.maxDepth||0)/5)); profile.pity=profile.pity||0; profile.sg=profile.sg||0; profile.pets=profile.pets||{own:{},eq:null}; profile.cache=profile.cache||{}; profile.recentT=profile.recentT||[]; if(profile.oreLv>0&&!profile.oreRef){ let sm=0; for(let i=0;i<profile.oreLv&&i<3;i++) sm+=[3000,25000,150000][i]; profile.coins=(profile.coins||0)+sm; profile.oreRef=1; gt('礦脈探測已移除，已退還 '+sm.toLocaleString()+' 金'); } profile.v2=1; refresh();
  if(db&&uid&&!localMode&&!offline){ try{ db.doc('grants/'+uid).onSnapshot(sn=>{ if(!sn.exists) return; const d=sn.data(); if(d.nonce&&d.nonce!==profile.lastGrant&&Number.isFinite(d.amount)){ profile.lastGrant=d.nonce; profile.coins=Math.max(0,(profile.coins||0)+d.amount); refresh(); save(); gt((d.amount>0?'管理員發放 +':'管理員扣除 ')+Math.abs(d.amount)+' 金'); } }); }catch(e){} } $('adm').style.display=(profile.name==='Hermes'&&!offline&&(isAdmin||localMode))?'block':'none';
  if(running) return; running=true;
  if(!window.THREE){ alert('3D 引擎載入失敗'); return; }
  const cv=$('cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:false});
  R.setPixelRatio(Math.min(devicePixelRatio,1.5)); R.shadowMap.enabled=true;
  const S=new THREE.Scene(); S.background=new THREE.Color(0x0b0910); S.fog=new THREE.Fog(0x0b0910,8,38);
  const C=new THREE.PerspectiveCamera(60,1,.1,80);
  const hemi=new THREE.HemisphereLight(0x8a7fb0,0x2a2018,.55); S.add(hemi);
  const torch=new THREE.PointLight(0xffc070,1.4,22,1.6); torch.castShadow=false; torch.shadow.mapSize.set(512,512); S.add(torch);

function shopMsg(t,ok){ const m=$('shopmsg'); m.className='msg'+(ok?' ok':''); m.textContent=t; }
const lack=p=>'金幣不足，還差 '+(p-(profile.coins||0)).toLocaleString()+' 金';
function pickAct(k){ const own=(profile.owned||['wood']).includes(k.id);
  if(!own){ if(k.need&&(profile.maxDepth||0)<k.need) return shopMsg('需先抵達 '+k.need.toLocaleString()+' m'); if((profile.coins||0)<k.price) return shopMsg(lack(k.price)); profile.coins-=k.price; profile.owned=(profile.owned||['wood']).concat(k.id); shopMsg('已購買 '+k.n,1); }
  else{ profile.pickaxe=k.id; shopMsg('已裝備 '+k.n,1); }
  refresh(); save(); renderShop(); checkAch(); }
function upgAct(key){ const d=UPG[key],lv=profile[key]||0,price=d.prices[lv]; if(lv>=d.vals.length-1) return;
  if(d.need&&lv===d.needLv&&(profile.maxDepth||0)<d.need) return shopMsg('需先抵達 '+d.need.toLocaleString()+' m 才能解鎖');
  if((profile.coins||0)<price) return shopMsg(lack(price));
  profile.coins-=price; profile[key]=lv+1; shopMsg(d.n+'已升級',1); refresh(); if(window.rebuildAll) window.rebuildAll(); save(); renderShop(); }
function buyTorch(){ if(profile.torchOwn) return; if((profile.coins||0)<TORCH_PRICE) return shopMsg(lack(TORCH_PRICE)); profile.coins-=TORCH_PRICE; profile.torchOwn=1; profile.torchOn=1; shopMsg('已購買火把，可用右側 🔦 開關',1); refresh(); save(); renderShop(); }
function toggleTorch(){ if(!profile.torchOwn) return; profile.torchOn=profile.torchOn?0:1; refresh(); save(); }
function buyPet(id){ const p=PETS.find(x=>x.id===id); if(!p||!p.price) return; const P2=profile.pets=profile.pets||{own:{},eq:null}; if(P2.own[id]) return; if((profile.coins||0)<p.price) return shopMsg(lack(p.price)); profile.coins-=p.price; P2.own[id]=1; shopMsg('獲得 '+p.n+'，到背包裝備',1); refresh(); save(); renderShop(); }
function equipPet(id){ const P2=profile.pets; if(!P2||!P2.own[id]) return; P2.eq=P2.eq===id?null:id; refresh(); save(); renderBag(); }
function upRows(l){ Object.keys(UPG).forEach(key=>{ const d=UPG[key],lv=profile[key]||0,done=lv>=d.vals.length-1,price=d.prices[lv],r=document.createElement('div'); r.className='row';
  const b=document.createElement('button'); b.className='b'+(done?' s':''); b.disabled=done; b.textContent=done?'已滿級':price.toLocaleString()+' 金';
  if(!done&&d.need&&lv===d.needLv&&(profile.maxDepth||0)<d.need){ b.textContent='需 '+d.need.toLocaleString()+'m'; b.disabled=true; b.className='b s'; }
  b.onclick=()=>upgAct(key); r.append(two(d.ic+' '+d.n+' Lv'+(lv+1),(done?'':d.vals[lv]+' → ')+d.vals[done?lv:lv+1]),b); l.append(r); }); }

function petCodex(l){ const P2=profile.pets||{own:{}},h=document.createElement('div'); h.className='note'; h.style.margin='10px 0 2px'; h.textContent='寵物圖鑑 '+PETS.filter(p=>P2.own[p.id]).length+' / '+PETS.length; l.append(h);

const LS={get:k=>{ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }};
async function hashPw(pw,salt){ const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']); const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const mkProfile=n=>({name:n,coins:0,pickaxe:'wood',owned:['wood'],x:0,z:0,depth:0,maxDepth:0,inv:{},created:Date.now()});

$('bRegGo').onclick=async()=>{ const n=$('rn').value.trim();
  if(!/^[\u4e00-\u9fa5A-Za-z0-9_-]{2,12}$/.test(n)) return msg('名稱需 2–12 字（中英數）');
  if(localMode){ const pw=$('rp').value; if(pw.length<4) return msg('密碼至少 4 碼'); if(pw!==$('rp2').value) return msg('兩次密碼不一致'); if(LS.get('dm:'+nameKey(n))) return msg('此玩家名稱已被使用'); }
  if(n.toLowerCase()==='hermes'&&!(await askPw())) return msg('管理員密碼錯誤');
  try{
    if(localMode){ const salt=Math.random().toString(36).slice(2)+Date.now(),hash=await hashPw($('rp').value,salt),np=impProfile(n); if(!LS.set('dm:'+nameKey(n),{salt,hash,profile:np})) return msg('無法寫入本機儲存空間'); profile=np; lkey=nameKey(n); lsalt=salt; lhash=hash; }
    else{ if(cloudProfile) return msg('你已有帳號，請直接登入'); const nd=db.doc('names/'+nameKey(n)); if((await nd.get()).exists) return msg('此玩家名稱已被使用'); await nd.set({owner:uid}); if((await nd.get()).data().owner!==uid) return msg('此玩家名稱已被使用');
      profile=mkProfile(n); await pdoc().set(profile); cloudProfile=profile; }
  }catch(e){ return msg(e&&e.message==='bad'?'存檔碼無效':'建立失敗，請稍後再試'); }
  await remind(); startGame(); };

  try{ if(window.claude){ db=await claude.use('db'); const u=await claude.use('user'); if(u){ uid=await u.id(); isAdmin=await u.isOwner(); } } }catch(e){}

  else{ $('n1').textContent='存檔綁定 Claude 登入帳號'; try{ const sn=await pdoc().get(); if(sn.exists) cloudProfile=JSON.parse(JSON.stringify(sn.data())); $('st').textContent=cloudProfile?'找到存檔：'+cloudProfile.name:'雲端存檔已連線'; }catch(e){ $('st').textContent='讀取失敗，請重新整理'; return; } }
  showForm('menu'); }
const ago=ms=>ms<3.6e6?Math.max(1,Math.round(ms/6e4))+' 分鐘前':ms<8.64e7?Math.round(ms/3.6e6)+' 小時前':Math.round(ms/8.64e7)+' 天前';

function impProfile(n){ const v=$('imp').value.trim(); if(!v) return mkProfile(n); let o; try{ o=JSON.parse(decodeURIComponent(escape(atob(v)))); }catch(e){ throw new Error('bad'); }
  if(!o||typeof o!=='object'||!Number.isFinite(o.coins)) throw new Error('bad'); delete o.lastGrant; return Object.assign(mkProfile(n),o,{name:n}); }

/* ---------- Supabase 線上帳號模式（SB_URL 有填才啟用） ---------- */
async function sb(path,o={}){
  const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json',Authorization:'Bearer '+((sbS&&sbS.access_token)||SB_KEY)},o.headers||{});
  const r=await fetch(SB_URL+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});
  if(r.status===401&&sbS&&sbS.refresh_token&&!o.retry&&await sbRefresh()) return sb(path,Object.assign({},o,{retry:1}));
  return r; }
async function sbRefresh(){ try{ const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sbS.refresh_token})}); if(!r.ok) return false; sbS=await r.json(); LS.set('dm:session',sbS); return true; }catch(e){ return false; } }
const sbEmail=n=>nameKey(n)+'@deepmine.game';
async function sbLoad(){ uid=sbS.user.id; const r=await sb('/rest/v1/profiles?id=eq.'+uid+'&select=name,data,is_admin'); if(!r.ok) return false; const a=await r.json(); if(!a.length) return false; profile=JSON.parse(JSON.stringify(a[0].data)); profile.name=a[0].name; isAdmin=!!a[0].is_admin; return true; }
async function applySbGrants(){ const r=await sb('/rest/v1/grants?user_id=eq.'+uid+'&applied=eq.false&select=id,amount'); if(!r.ok) return; for(const g of await r.json()){ profile.coins=Math.max(0,(profile.coins||0)+g.amount); refresh(); gt((g.amount>0?'管理員發放 +':'管理員扣除 ')+Math.abs(g.amount)+' 金'); await sb('/rest/v1/grants?id=eq.'+g.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:{applied:true}}); } }
async function sbSave(){ if(!sbS||!profile||offline) return; if(sbSaving){ sbDirty=true; return; } sbSaving=true;
  try{ do{ sbDirty=false; await applySbGrants(); const r=await sb('/rest/v1/profiles?id=eq.'+uid,{method:'PATCH',headers:{Prefer:'return=minimal'},body:{data:JSON.parse(JSON.stringify(profile)),coins:profile.coins||0,max_depth:profile.maxDepth||0,last_seen:new Date().toISOString()}}); if(!r.ok) throw 0; }while(sbDirty); }
  catch(e){ gt('存檔失敗，5 秒後重試'); setTimeout(sbSave,5000); }
  sbSaving=false; }
function renderAdmLocal(){ const l=$('admlist'); l.innerHTML='';
  const h=document.createElement('div'); h.className='note'; h.textContent='管理員：調整自己的金幣'; l.append(h);
  const c=document.createElement('div'); c.className='row'; c.style.fontSize='18px'; c.textContent='💰 '+(profile.coins||0).toLocaleString(); l.append(c);
  const i=document.createElement('input'); i.type='number'; i.placeholder='金幣數量'; l.append(i);
  const go=sg=>{ const a=Math.abs(parseInt(i.value)); if(!a) return; profile.coins=Math.max(0,(profile.coins||0)+sg*a); refresh(); save(); renderAdmLocal(); };
  const b1=document.createElement('button'); b1.className='b'; b1.textContent='＋ 增加'; b1.onclick=()=>go(1);
  const b2=document.createElement('button'); b2.className='b s'; b2.textContent='－ 減少'; b2.onclick=()=>go(-1); l.append(b1,b2); }
async function renderAdmSB(){ const l=$('admlist'); l.textContent='載入中…';
  try{ const r=await sb('/rest/v1/profiles?select=id,name,coins,max_depth,last_seen&order=last_seen.desc'); if(!r.ok) throw 0; const rows=await r.json(),now=Date.now(),on=rows.filter(p=>now-new Date(p.last_seen)<45000).length; l.innerHTML='';
    const h=document.createElement('div'); h.className='note'; h.textContent='線上 '+on+' 人／共 '+rows.length+' 人'; l.append(h);
    rows.forEach(p=>{ const online=now-new Date(p.last_seen)<45000,d=document.createElement('div'); d.className='row'; d.style.flexWrap='wrap';
      const t=two((online?'🟢 ':'⚪ ')+p.name,'💰'+(p.coins||0).toLocaleString()+'・深'+(p.max_depth||0)+'m'+(online?'':'・'+ago(now-new Date(p.last_seen)))); t.style.flexBasis='100%';
      const i=document.createElement('input'); i.type='number'; i.placeholder='金幣數量'; i.style.width='90px';
      const mk=(lab,sg)=>{ const b=document.createElement('button'); b.className='b'+(sg<0?' s':''); b.textContent=lab; b.onclick=async()=>{ const a=Math.abs(parseInt(i.value)); if(!a) return; const x=await sb('/rest/v1/grants',{method:'POST',headers:{Prefer:'return=minimal'},body:{user_id:p.id,amount:sg*a}}); b.textContent=x.ok?'✓':'✗'; setTimeout(()=>b.textContent=lab,1500); }; return b; };
      const pi=document.createElement('input'); pi.placeholder='新密碼（6碼以上）'; pi.style.width='130px';
      const kb=document.createElement('button'); kb.className='b s'; kb.textContent='改密碼'; kb.onclick=async()=>{ if(pi.value.length<6){ kb.textContent='需6碼'; setTimeout(()=>kb.textContent='改密碼',1500); return; } const x=await sb('/functions/v1/admin-set-password',{method:'POST',body:{user_id:p.id,password:pi.value}}); kb.textContent=x.ok?'已更改':'失敗'; if(x.ok) pi.value=''; setTimeout(()=>kb.textContent='改密碼',1800); };
      d.append(t,i,mk('＋',1),mk('－',-1),pi,kb); l.append(d); }); }
  catch(e){ l.textContent='讀取失敗，請確認你是管理員'; } }
async function bootSB(){
  sbMode=true; localMode=false; ['lp','rp','rp2'].forEach(i=>$(i).style.display='block'); $('n1').textContent='線上帳號・換裝置也能登入'; $('bOff').style.display='block';
  $('bLogin').onclick=()=>showForm('lg'); $('bReg').onclick=()=>showForm('reg');
  $('bLoginGo').onclick=async()=>{ const n=$('ln').value.trim(),pw=$('lp').value; if(!n||!pw) return msg('請輸入名稱與密碼');
    if(n.toLowerCase()==='hermes'&&!(await askPw())) return msg('管理員密碼錯誤'); msg('登入中…',true);
    try{ const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:sbEmail(n),password:pw})});
      if(!r.ok) return msg('名稱或密碼錯誤'); sbS=await r.json(); LS.set('dm:session',sbS); if(!(await sbLoad())) return msg('找不到玩家資料'); msg(''); startGame();
    }catch(e){ msg('網路錯誤，請重試'); } };
  $('bRegGo').onclick=async()=>{ const n=$('rn').value.trim(),pw=$('rp').value;
    if(!/^[\u4e00-\u9fa5A-Za-z0-9_-]{2,12}$/.test(n)) return msg('名稱需 2–12 字（中英數）'); if(pw.length<6) return msg('密碼至少 6 碼'); if(pw!==$('rp2').value) return msg('兩次密碼不一致');
    if(n.toLowerCase()==='hermes'&&!(await askPw())) return msg('管理員密碼錯誤'); msg('建立中…',true);
    try{ const np=impProfile(n);
      const r=await fetch(SB_URL+'/auth/v1/signup',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:sbEmail(n),password:pw})}); const j=await r.json();
      if(!r.ok) return msg(/registered|exists/i.test(JSON.stringify(j))?'此玩家名稱已被使用':'註冊失敗：'+(j.msg||j.error_description||r.status));
      if(!j.access_token) return msg('請先在 Supabase 關閉 Confirm email');
      sbS=j; LS.set('dm:session',sbS); uid=j.user.id;
      const ins=await sb('/rest/v1/profiles',{method:'POST',headers:{Prefer:'return=minimal'},body:{id:uid,name:n,data:np,coins:np.coins||0,max_depth:np.maxDepth||0}});
      if(!ins.ok) return msg('建立資料失敗，請重試'); profile=np; isAdmin=false; msg(''); await remind(); startGame();
    }catch(e){ msg(e&&e.message==='bad'?'存檔碼無效':'網路錯誤，請重試'); } };
  const ss=LS.get('dm:session');
  if(ss&&ss.refresh_token){ sbS=ss; $('st').textContent='登入中…'; if(await sbRefresh()&&await sbLoad()) return startGame(); sbS=null; }
  $('st').textContent='線上帳號'; showForm('menu'); }
$('rn').oninput=()=>{ $('imp').style.display=((localMode||!!SB_URL)&&$('rn').value.trim().toLowerCase()==='hermes')?'block':'none'; };

$('tc').onclick=toggleTorch;
boot2();
