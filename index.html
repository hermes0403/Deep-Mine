<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>深層礦域</title>
<style>
:root{color-scheme:dark;--bg:#0d0b12;--panel:#1b1724;--ac:#f5b942;--tx:#f1ece4;--mut:#9a92a8;--err:#ff7b7b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a2236,var(--bg));padding:20px;z-index:5;touch-action:auto}
.card{width:100%;max-width:360px;background:var(--panel);border-radius:18px;padding:22px;box-shadow:0 10px 40px #000a}
h1{margin:0 0 4px;font-size:30px;color:var(--ac);text-align:center;letter-spacing:4px}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:16px}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #3a3350;background:#120f1a;color:var(--tx);font-size:16px;touch-action:auto}
button.b{width:100%;padding:13px;margin:6px 0;border:0;border-radius:12px;background:var(--ac);color:#1a1200;font-weight:700;font-size:16px}
button.b.s{background:#2d2640;color:var(--tx)}
.msg{min-height:20px;font-size:13px;margin:6px 0;color:var(--err)}.msg.ok{color:#7be0a0}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin-top:10px}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:none;justify-content:space-between;padding:10px 12px;z-index:3;pointer-events:none;font-size:14px}
#hud>div{background:#000a;border-radius:10px;padding:6px 10px}
#out{pointer-events:auto}
#joy{position:fixed;left:24px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff40;display:none;z-index:3}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#ffffff66}
#tip{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;color:var(--mut);z-index:3;pointer-events:none;display:none}
.ui{position:fixed;z-index:4;border:0;color:#fff;font-weight:700}
#dig{right:22px;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;background:#e0702acc;font-size:18px;display:none}
#dig:active{transform:scale(.92)}
#bag,#adm{right:12px;width:52px;height:52px;border-radius:14px;background:#000a;font-size:22px;display:none}
#bag{top:64px}#adm{top:124px}
#tg{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:13px;z-index:3;pointer-events:none;color:var(--ac)}
#toast{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:20px;font-weight:700;z-index:6;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 2px 6px #000}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #3a3350;font-size:14px}
.row input{margin:0;padding:6px}
#shop{right:12px;top:184px;width:52px;height:52px;border-radius:14px;background:#000a;font-size:22px;display:none}
.sw{width:26px;height:26px;border-radius:6px;flex:none}
.row button{width:auto;margin:0;padding:6px 10px;font-size:13px}
#rail{position:fixed;right:12px;top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:4}
#rail .ui{position:static;width:44px;height:44px;border-radius:13px;background:#000a;font-size:18px}
#tg{top:calc(76px + env(safe-area-inset-top,0px))}
#hud>div{white-space:nowrap;font-size:13px;line-height:1.5}
.row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .two{flex:1;display:block}.row .two small{display:block;color:var(--mut);font-size:12px}
.note{white-space:nowrap}
.card{position:relative;max-height:88vh;overflow-y:auto}
.card,.card *{touch-action:pan-y}
.card>.b.s:last-child{position:sticky;bottom:0}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;border-radius:50%;background:#2d2640;color:#fff;font-size:18px;z-index:2;margin:0;padding:0}
#rail{max-height:calc(100vh - 220px);flex-wrap:wrap-reverse;align-content:flex-start}
@media (orientation:landscape){#joy{width:110px;height:110px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}#knob{left:25px;top:25px}#dig{bottom:calc(16px + env(safe-area-inset-bottom,0px));width:84px;height:84px}#rail{max-height:calc(100vh - 190px);right:calc(12px + env(safe-area-inset-right,0px))}#joy{left:calc(24px + env(safe-area-inset-left,0px))}.screen{align-items:flex-start;overflow-y:auto}.card{margin:auto}}
textarea{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #3a3350;background:#120f1a;color:var(--tx);font-size:13px;touch-action:auto}
button,.ui,#dig{touch-action:manipulation !important}
textarea,input{font-size:16px !important}
#scn{position:fixed;top:calc(96px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:12px;color:#7be0a0;z-index:3;pointer-events:none}
#mpc{display:block;margin:6px 0}
#pt{position:fixed;top:calc(114px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:12px;color:#ffd34a;z-index:3;pointer-events:none}
#lo{display:none}
#vh{display:none}
#cmp{position:fixed;left:12px;top:calc(64px + env(safe-area-inset-top,0px));width:52px;height:52px;border-radius:50%;background:#000a;border:1px solid #ffffff55;z-index:3;pointer-events:none;display:none}
#cmpr{position:absolute;inset:0}
#cmpr b{position:absolute;font-size:11px;line-height:1;color:#fff;transform:translate(-50%,-50%)}
#cmpr b:nth-child(1){top:9px;left:50%;color:#ff5a5a}
#cmpr b:nth-child(2){top:50%;left:calc(100% - 9px)}
#cmpr b:nth-child(3){top:calc(100% - 9px);left:50%}
#cmpr b:nth-child(4){top:50%;left:9px}
#cmp u{position:absolute;left:50%;top:-5px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:7px solid #ffd34a;transform:translateX(-50%);text-decoration:none}
#hpb{position:fixed;left:12px;top:calc(122px + env(safe-area-inset-top,0px));width:max-content;min-width:150px;box-sizing:border-box;padding-right:8px;height:18px;border-radius:9px;background:#000a;border:1px solid #ffffff55;z-index:3;pointer-events:none;overflow:hidden;display:none}
#hpf{position:absolute;left:0;top:0;bottom:0;background:#c42424;width:100%}
#hpt{position:relative;font-size:11px;line-height:18px;padding-left:6px;white-space:nowrap}
.cxg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cxc{background:#120f1a;border-radius:10px;padding:7px 2px 6px;text-align:center}
.cxc i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 4px}
.cxc b{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cxc small{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bsm,#bbg{right:126px;width:52px;height:52px;border-radius:50%;font-size:15px;display:none}
#bsm{bottom:calc(42px + env(safe-area-inset-bottom,0px));background:#8a4a1acc}
#bbg{bottom:calc(102px + env(safe-area-inset-bottom,0px));background:#b02a2acc}
@media (orientation:landscape){#bsm{right:110px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}#bbg{right:110px;bottom:calc(72px + env(safe-area-inset-bottom,0px))}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><div>👤 <span id="pn">-</span>　💰 <span id="coin">0</span><br>⛏ <span id="pk">木製十字鎬</span>　🎒 <span id="cap">0/50</span></div><div>⬇ <span id="dp">0</span>m　<button id="out" class="b s ui" style="width:auto;margin:0;padding:4px 10px;font-size:13px">登出</button><br><span id="bm"></span></div></div>
<div id="joy"><div id="knob"></div></div>
<div id="tip">搖桿移動・拖曳轉視角</div>

<div id="cmp"><div id="cmpr"><b>N</b><b>E</b><b>S</b><b>W</b></div><u></u></div><div id="hpb"><div id="hpf"></div><span id="hpt"></span></div><div id="tg"></div><div id="scn"></div><div id="pt"></div><div id="toast"></div>
<button class="ui" id="dig">⛏ 挖掘</button><button class="ui" id="bsm">💣0</button><button class="ui" id="bbg">💥0</button><div id="rail"><button class="ui" id="bag">🎒</button><button class="ui" id="shop">🛒</button><button class="ui" id="lo">🎰</button><button class="ui" id="zn">🧭</button><button class="ui" id="cx">📖</button><button class="ui" id="mp">🗺</button><button class="ui" id="adm">🛠</button></div>
<div class="screen" id="bagp" style="display:none"><div class="card"><h1 style="font-size:22px">背包</h1><div class="note" id="bagc"></div><div id="bagl"></div><div id="bagmsg" class="msg ok"></div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="shopp" style="display:none"><div class="card" style="max-width:420px;max-height:90vh;overflow:auto"><h1 style="font-size:22px">商店</h1><div class="note" id="shopc"></div><div id="shopl"></div><div id="shopmsg" class="msg"></div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="cxp" style="display:none"><div class="card" style="max-width:420px;max-height:90vh;overflow:auto"><h1 style="font-size:22px">礦物圖鑑</h1><div class="note" id="cxc"></div><div id="cxl"></div><div class="note" id="cxd" style="white-space:normal;min-height:34px;margin-top:6px">點一格可以查看介紹</div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="zonp" style="display:none"><div class="card" style="max-width:420px"><h1 style="font-size:22px">礦區</h1><div id="zonl"></div><div id="zonm" class="msg"></div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="pwp" style="display:none;z-index:8"><div class="card"><h1 style="font-size:22px">管理員驗證</h1><div class="note">請輸入密碼</div><input id="pwi" type="password" inputmode="numeric" placeholder="密碼"><div id="pwm" class="msg"></div><button class="b" id="pwok">確認</button><button class="b s" id="pwno">取消</button></div></div>
<div class="screen" id="rmp" style="display:none;z-index:8"><div class="card" style="text-align:center"><h1 style="font-size:22px">帳號建立成功</h1><div class="note" style="text-align:center">請牢記你的玩家名稱</div><div id="rmn" style="font-size:26px;font-weight:700;color:var(--ac);margin:12px 0;word-break:break-all"></div><div class="note" id="rmt" style="text-align:center"></div><div class="note" style="text-align:center">進度會自動永久保存</div><button class="b" id="rmok">我記住了，開始遊戲</button></div></div>
<div class="screen" id="expp" style="display:none;z-index:8"><div class="card"><h1 style="font-size:22px">匯出存檔碼</h1><div class="note">貼到 GitHub 版註冊頁的匯入欄</div><textarea id="expt" readonly rows="4"></textarea><div id="expm" class="msg ok"></div><button class="b" id="expc">複製</button><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="mpp" style="display:none"><div class="card" style="max-width:420px"><h1 style="font-size:22px">探勘地圖</h1><canvas id="mpc" width="288" height="288" style="width:100%"></canvas><div class="note" id="mpl" style="white-space:normal">⬜出生點　🟨寶箱　🟪秘密房間　🟦遺跡機關　🟧隱藏地點</div><div id="mpi"></div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="lop" style="display:none"><div class="card" style="max-width:420px"><h1 style="font-size:22px">抽獎</h1><div class="note" id="loc"></div><div id="lol"></div><button class="b" id="lob">抽獎（8 殭屍幣）</button><div id="lom" class="msg ok"></div><div id="lof"></div><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="admp" style="display:none"><div class="card" style="max-width:420px"><h1 style="font-size:22px">管理員面板</h1><div class="note">玩家清單與金幣發放（僅管理員可見）</div><div id="admlist"></div><button class="b s" onclick="renderAdm()">重新整理</button><button class="b s" onclick="this.closest('.screen').style.display='none'">關閉</button></div></div>
<div class="screen" id="title"><div class="card">
<h1>深層礦域</h1><div class="sub">礦坑探索 試玩版</div>
<div id="st" class="note" style="margin:0 0 8px">連線中…</div>
<div id="menu" style="display:none"><button class="b" id="bLogin">登入帳號</button><button class="b s" id="bReg">註冊新帳號</button></div>
<div id="lg" style="display:none"><div class="note" style="color:var(--tx)">登入現有帳號</div><input id="ln" placeholder="玩家名稱" maxlength="12"><input id="lp" type="password" placeholder="密碼"><button class="b" id="bLoginGo">登入</button><button class="b s" id="bBack1">返回</button></div>
<div id="reg" style="display:none"><div class="note" style="color:var(--tx)">註冊新帳號</div><input id="rn" placeholder="玩家名稱（2–12 字）" maxlength="12"><input id="rp" type="password" placeholder="密碼（至少 4 碼）"><input id="rp2" type="password" placeholder="確認密碼"><textarea id="imp" style="display:none" rows="2" placeholder="匯入存檔碼（選填）"></textarea><button class="b" id="bRegGo">註冊並進入遊戲</button><button class="b s" id="bBack">返回</button></div>
<div id="msg" class="msg"></div>
<button class="b s" id="bOff" style="display:none">離線試玩（不存檔）</button>
<div class="note" id="n1"></div><div class="note">請牢記你的玩家名稱</div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const SB_URL='',SB_KEY='';
const FB_CFG={apiKey:'',authDomain:'',databaseURL:'',projectId:'',appId:''}; // 在線玩家（Firebase）：沒填就完全不啟用
let sbMode=false,sbS=null,sbSaving=false,sbDirty=false;
let db=null,uid=null,profile=null,offline=false,running=false,saveT=0,isAdmin=false;
const OD=[{id:'stone',n:'普通石塊',hp:20,min:5,c:0x8a8a8a,sc:0,p:5},{id:'coal',n:'煤礦',hp:40,min:5,c:0x2a2a30,sc:0x666677,p:12},{id:'copper',n:'銅礦',hp:80,min:10,c:0x8a5a3a,sc:0xff9a4a,p:30},{id:'iron',n:'鐵礦',hp:120,min:10,c:0x8f8580,sc:0xe8e0d8,p:55},{id:'gold',n:'黃金礦',hp:200,min:22,c:0x8a7a2a,sc:0xffd34a,p:180},{id:'bcrystal',n:'藍水晶',hp:300,min:22,c:0x2a5a8a,sc:0x59b8ff,p:350},{id:'amethyst',n:'紫水晶',hp:600,min:45,c:0x5a2a8a,sc:0xb36bff,p:900},{id:'ruby',n:'紅寶石礦',hp:800,min:45,c:0x8a2a3a,sc:0xff4a6a,p:1800},{id:'lava',n:'熔岩礦',hp:1500,min:90,c:0x5a1a0a,sc:0xff7a1a,p:5000},{id:'meteor',n:'星隕礦',hp:2500,min:180,c:0x2a2a4a,sc:0x8a7aff,p:12000},{id:'fossil',n:'遠古化石礦',hp:5000,min:350,c:0x6a5a3a,sc:0xd8c9a0,p:30000},{id:'void',n:'虛空核心',hp:8000,min:700,c:0x2a0a3a,sc:0xc040ff,p:80000},{id:'abyss',n:'深淵晶',hp:15000,min:1000,c:0x201040,sc:0x7a5cff,p:150000},{id:'prism',n:'稜光晶',hp:30000,min:1500,c:0x103040,sc:0x40ffe0,p:400000},{id:'omega',n:'終末晶核',hp:60000,min:2000,c:0x0a0a1a,sc:0xff3a6e,p:1000000},{id:'quantum',n:'量子鉍晶',hp:90000,min:2400,c:0x0a1a3a,sc:0x40e0ff,p:4800000},{id:'singularity',n:'星淵奇點',hp:150000,min:2600,c:0x120018,sc:0xff2aff,p:15000000,reqPick:'stellar'}];
async function applyGrant(){ try{ const g=await db.doc('grants/'+uid).get(); if(g.exists){const d=g.data(); if(d.nonce&&d.nonce!==profile.lastGrant&&Number.isFinite(d.amount)){profile.coins=Math.max(0,(profile.coins||0)+d.amount);profile.lastGrant=d.nonce;await pdoc().set(profile);}} }catch(e){} }
$('bag').onclick=()=>{ const l=$('bagl'); l.innerHTML=''; OD.forEach(o=>{const n=(profile.inv||{})[o.id]||0; const r=document.createElement('div'); r.className='row'; r.textContent=o.n+'　×'+n+'　（單件 '+o.p+' 金）'; l.append(r);}); $('bagp').style.display='flex'; };
$('adm').onclick=()=>{ $('admp').style.display='flex'; renderAdm(); };
const msg=(t,ok)=>{$('msg').textContent=t||'';$('msg').className='msg'+(ok?' ok':'')};
const nameKey=n=>[...n.toLowerCase()].map(c=>c.codePointAt(0).toString(16)).join('-');
const pdoc=()=>db.doc('data/users/'+uid+'/profile');

async function boot(){
  try{ if(window.claude){ db=await claude.use('db'); const u=await claude.use('user'); if(u){ uid=await u.id(); isAdmin=await u.isOwner(); } } }catch(e){}
  $('bOff').style.display='block';
  if(!db||!uid){ $('st').textContent='無法連線存檔，可離線試玩';return; }
  try{
    const s=await pdoc().get();
    if(s.exists){ profile=JSON.parse(JSON.stringify(s.data())); $('st').textContent='找到存檔：'+profile.name; $('menu').style.display='block'; $('bLogin').textContent='登入（'+profile.name+'）'; $('bReg').style.display='none'; }
    else{ $('st').textContent='尚無資料，請先創建帳號'; $('menu').style.display='block'; $('bLogin').style.display='none'; }
  }catch(e){ $('st').textContent='讀取失敗，請重新整理'; }
}
$('bReg').onclick=()=>{$('menu').style.display='none';$('reg').style.display='block';msg('')};
$('bBack').onclick=()=>{$('reg').style.display='none';$('menu').style.display='block';msg('')};
$('bLogin').onclick=async()=>{ if(profile){ if(profile.name.toLowerCase()==='hermes'&&!(await askPw())) return msg('密碼錯誤'); await applyGrant(); startGame(); } };
$('bOff').onclick=()=>{ offline=true; profile={name:'訪客',coins:0,x:0,z:0,depth:0}; startGame(); };
$('bRegGo').onclick=async()=>{
  const n=$('rn').value.trim();
  if(!/^[\u4e00-\u9fa5A-Za-z0-9_-]{2,12}$/.test(n)) return msg('名稱需 2–12 字（中英數）');
  try{
    if(n.toLowerCase()==='hermes'&&!(await askPw())) return msg('密碼錯誤，無法使用此名稱');
    const nd=db.doc('names/'+nameKey(n)); const ex=await nd.get();
    if(ex.exists) return msg('此玩家名稱已被使用');
    await nd.set({owner:uid});
    const again=await nd.get(); if(again.data().owner!==uid) return msg('此玩家名稱已被使用');
    profile={name:n,coins:0,pickaxe:'wood',owned:['wood'],x:0,z:0,depth:0,maxDepth:0,inv:{},created:Date.now()};
    await pdoc().set(profile); await new Promise(r=>{ $('rmn').textContent=profile.name; $('rmp').style.display='flex'; $('rmok').onclick=()=>{ $('rmp').style.display='none'; r(); }; }); startGame();
  }catch(e){ msg('建立失敗，請稍後再試'); }
};
$('out').onclick=async()=>{ if(sbMode){ await sbSave(); LS.set('dm:session',null); } else await save(true); location.reload(); };
let saving=false,dirty=false;
async function save(force){
  if(sbMode) return sbSave();
  if(offline||!profile) return;
  if(localMode){ const cur=LS.get('dm:'+lkey); if(cur&&cur.profile&&(cur.profile.rev||0)>lrev){ adoptNewer(cur.profile); return; } profile.rev=(profile.rev||0)+1; lrev=profile.rev; LS.set('dm:'+lkey,{salt:lsalt,hash:lhash,profile}); return; }
  if(!db) return;

const VEH=[{id:'skate',n:'滑板',price:800000,sp:1},{id:'bike',n:'腳踏車',price:3000000,sp:1.8},{id:'moto',n:'摩托車',price:10000000,sp:2.5}];
const vehSp=()=>{ const v=profile&&profile.veh,d=v&&v.eq&&v.own&&v.own[v.eq]?VEH.find(x=>x.id===v.eq):null; return d?d.sp:0; };
function fitRows(l){ const F=profile.fit; OUTFITS.forEach(o=>{ const own=o.price===0||F.own[o.id],eq=(F.eq||'default')===o.id,r=document.createElement('div'); r.className='row';
  const sw=document.createElement('div'); sw.className='sw'; sw.style.background=hex(o.shirt); const b=document.createElement('button'); b.className='b'+(eq?' s':''); b.disabled=eq; b.textContent=eq?'穿著中':own?'穿上':'購買'; b.onclick=()=>fitAct(o.id);
  r.append(sw,two(o.n,o.price?fmtP(o.price)+' 金':'免費'),b); l.append(r); }); }
function fitAct(id){ const o=OUTFITS.find(x=>x.id===id),F=profile.fit; if(!o) return; const own=o.price===0||F.own[id];
  if(!own){ if((profile.coins||0)<o.price) return shopMsg(lack(o.price)); profile.coins-=o.price; F.own[id]=1; shopMsg('已購買 '+o.n,1); } else { F.eq=id; shopMsg('已穿上 '+o.n,1); }
  refresh(); save(); renderShop(); }
function vehMsg(t,ok){ ['shopmsg'].forEach(i=>{ const m=$(i); m.className='msg'+(ok?' ok':''); m.textContent=t; }); }
function vehAct(id){ const d=VEH.find(x=>x.id===id),V=profile.veh; if(!d) return;
  if(!V.own[id]){ if((profile.coins||0)<d.price) return vehMsg(lack(d.price)); profile.coins-=d.price; V.own[id]=1; vehMsg('已購買 '+d.n+'，按「裝備」使用',1); }
  else{ V.eq=V.eq===id?null:id; vehMsg(V.eq?'已裝備 '+d.n:'已卸下 '+d.n,1); }
  refresh(); save(); if(shopTab==='veh') renderShop(); }

    r.append(two(d.n+(eq?'（裝備中）':''),'速度 +'+d.sp+'・'+(own?'已擁有':fmtP(d.price)+' 金')),b); l.append(r); }); }
/* ---------- 在線玩家（Firebase Realtime Database；沒填 FB_CFG 就不啟用，不影響遊戲） ---------- */
let FBAPP=null,fbRef=null,fbConn=null,fbHB=0,fbAdmin=false,fbSub=null,fbData={},fbOff=0,fbBox=null,fbNote='';
const fbOn=()=>!!(FB_CFG.apiKey&&FB_CFG.databaseURL);
async function fbLoad(){ if(!fbOn()) return false; if(FBAPP) return true;
  try{ for(const n of ['app','auth','database']) await new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-'+n+'-compat.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); });
    FBAPP=firebase.initializeApp(FB_CFG); return true; }catch(e){ return false; } }
function fbSetup(u){ clearInterval(fbHB); if(fbConn){ try{ fbConn.off(); }catch(e){} fbConn=null; } fbRef=null; if(!u||!profile||offline) return;
  const db=firebase.database(); fbRef=db.ref('presence/'+u.uid);
  const beat=()=>{ if(fbRef) fbRef.update({n:String(profile.name||'').slice(0,12),t:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{}); };
  fbConn=db.ref('.info/connected'); fbConn.on('value',sn=>{ if(sn.val()&&fbRef){ fbRef.onDisconnect().remove(); beat(); } }); fbHB=setInterval(beat,30000); }
async function fbStart(){ if(offline||!profile||!(await fbLoad())) return;
  try{ firebase.auth().onAuthStateChanged(u=>fbSetup(u)); if(!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); }catch(e){} }
addEventListener('pagehide',()=>{ try{ if(fbRef) fbRef.remove(); }catch(e){} });
async function fbAdminLogin(email,pw){ fbNote='登入中…'; fbDraw(); if(!(await fbLoad())){ fbNote='Firebase 載入失敗'; fbDraw(); return; }
  try{ await firebase.auth().signInWithEmailAndPassword(email,pw); }catch(e){ fbNote='帳號或密碼錯誤'; fbDraw(); return; }
  const db=firebase.database(); try{ fbOff=(await db.ref('.info/serverTimeOffset').once('value')).val()||0; }catch(e){}
  fbSub=db.ref('presence'); fbSub.on('value',sn=>{ fbData=sn.val()||{}; fbAdmin=true; fbNote=''; fbDraw(); },()=>{ fbAdmin=false; fbSub=null; fbNote='此帳號沒有管理權限'; fbDraw(); firebase.auth().signOut().then(()=>firebase.auth().signInAnonymously()).catch(()=>{}); }); }
async function fbAdminLogout(){ try{ if(fbSub) fbSub.off(); }catch(e){} fbSub=null; fbAdmin=false; fbData={}; fbNote=''; try{ await firebase.auth().signOut(); await firebase.auth().signInAnonymously(); }catch(e){} fbDraw(); }
function fbAgo(ms){ const sec=Math.max(0,Math.round(ms/1000)); return sec<10?'剛剛':sec<60?sec+' 秒前':Math.round(sec/60)+' 分鐘前'; }
function fbOnline(){ const now=Date.now()+fbOff; return Object.keys(fbData||{}).map(k=>({n:(fbData[k]||{}).n||'?',t:(fbData[k]||{}).t||0})).filter(x=>now-x.t<90000).sort((a,b)=>b.t-a.t).map(x=>({n:x.n,ago:now-x.t})); }
function fbAdminSection(l){ const h=document.createElement('div'); h.className='note'; h.style.margin='12px 0 2px'; h.textContent='在線玩家'; l.append(h);
  if(!fbOn()){ const e=document.createElement('div'); e.className='note'; e.textContent='尚未設定 Firebase'; l.append(e); return; }
  fbBox=document.createElement('div'); l.append(fbBox); fbDraw(); }
function fbDraw(){ const box=fbBox; if(!box) return; box.innerHTML='';
  if(!fbAdmin){ const em=document.createElement('input'); em.type='email'; em.placeholder='管理員 Email'; const pw=document.createElement('input'); pw.type='password'; pw.placeholder='管理員密碼';
    const b=document.createElement('button'); b.className='b'; b.textContent='管理員登入（Firebase）'; b.onclick=()=>fbAdminLogin(em.value.trim(),pw.value);
    const m=document.createElement('div'); m.className='msg'; m.textContent=fbNote; box.append(em,pw,b,m); return; }
  const list=fbOnline(),c=document.createElement('div'); c.className='row'; c.style.fontSize='18px'; c.textContent='🟢 目前在線 '+list.length+' 人'; box.append(c);
  list.forEach(x=>{ const r=document.createElement('div'); r.className='row'; const a=document.createElement('span'); a.textContent=x.n; const z=document.createElement('span'); z.textContent=fbAgo(x.ago); r.append(a,z); box.append(r); });
  const o=document.createElement('button'); o.className='b s'; o.textContent='登出管理員'; o.onclick=fbAdminLogout; box.append(o); }
setInterval(()=>{ if(fbAdmin&&$('admp').style.display==='flex') fbDraw(); },5000);
